aid: modern-electron
name: Modern Electron
description: >-
  Modern Electron is a Bothell, Washington energy-hardware company founded in 2015 by Tony Pan (CEO)
  and Max Mankin (CTO) as a spin-out of Intellectual Ventures. It was built to commercialize advanced
  thermionic energy converters — solid-state, direct heat-to-electricity devices intended to add
  on-site generation to combustion and thermal equipment. The company now operates publicly as Modern
  Hydrogen, applying methane pyrolysis behind the meter to crack natural gas into hydrogen and solid
  carbon before combustion, for industrial heat and steam, on-site power, data-center energy, asphalt
  products and heavy-duty fleet fueling. The product is physical equipment installed at customer
  sites; Modern Electron / Modern Hydrogen operates no developer program, publishes no public API,
  SDK or machine-readable specification, and its public GitHub organization holds only forks of
  open-source scientific-computing projects (WarpX, AMReX, PICMI, GPy) used in its own R&D.
